name: Publish web game

# Unity Personal cannot build in the cloud (no headless license), so the game is
# built on the Mac with Arm Sort > Build Web, the compressed files are committed
# to web/Build, and this workflow publishes them to https://veldig.github.io/arm-sort/
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages cannot serve Unity's pre-compressed files with the right
      # headers, so ship plain files and let Pages compress them on the fly.
      - name: Assemble site
        run: |
          set -e
          sudo apt-get install -y brotli > /dev/null
          src=web/Build
          mkdir -p site/Build
          for f in Web.data Web.framework.js Web.wasm; do
            if [ -f "$src/$f.unityweb" ]; then
              # Unity's "decompression fallback" files: gzip or brotli inside
              if gzip -t "$src/$f.unityweb" 2>/dev/null; then gunzip -c "$src/$f.unityweb" > "site/Build/$f"
              else brotli -d -c "$src/$f.unityweb" > "site/Build/$f"; fi
            elif [ -f "$src/$f.br" ]; then brotli -d -c "$src/$f.br" > "site/Build/$f"
            elif [ -f "$src/$f.gz" ]; then gunzip -c "$src/$f.gz" > "site/Build/$f"
            else cp "$src/$f" "site/Build/$f"; fi
          done
          cp "$src/Web.loader.js" site/Build/
          sed "s/__BUILD_VERSION__/${GITHUB_SHA::8}/g" web/index.html > site/index.html
          touch site/.nojekyll
          ls -la site/Build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
